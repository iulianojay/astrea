<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helios - Earth Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.65), rgba(10, 20, 30, 0.5));
            padding: 18px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 100;
            backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(25, 65, 115, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }

        #info h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4da6ff;
            text-shadow: 0 0 10px rgba(77, 166, 255, 0.3);
        }

        #info p {
            margin: 5px 0;
            color: #ccc;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.65), rgba(10, 20, 30, 0.5));
            padding: 18px 24px;
            border-radius: 12px;
            font-size: 12px;
            z-index: 100;
            backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(25, 65, 115, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }

        .controls h3 {
            margin-bottom: 8px;
            color: #4da6ff;
            text-shadow: 0 0 10px rgba(77, 166, 255, 0.3);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .controls ul {
            list-style: none;
        }

        .controls li {
            margin: 4px 0;
            color: #bbb;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <script src="renderer.js"></script>
</body>

</html>
