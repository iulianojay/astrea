<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helios - Earth Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        #info h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4da6ff;
        }

        #info p {
            margin: 5px 0;
            color: #ccc;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .controls h3 {
            margin-bottom: 8px;
            color: #4da6ff;
        }

        .controls ul {
            list-style: none;
        }

        .controls li {
            margin: 3px 0;
            color: #aaa;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div id="info">
        <h1>Helios</h1>
        <p>Earth Visualization System</p>
    </div>

    <div class="controls">
        <h3>Controls</h3>
        <ul>
            <li>🖱️ Left Click + Drag: Rotate</li>
            <li>🖱️ Right Click + Drag: Pan</li>
            <li>🖱️ Scroll: Zoom</li>
        </ul>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
