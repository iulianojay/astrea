<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/webui.js"></script>
    <title>Astrea Helios</title>
    <style>
        :root {
            --bg0: #081226;
            --bg1: #12304a;
            --ink: #e9f4ff;
            --muted: #93b6d8;
            --earth: #2e78d8;
            --earth-atmo: #5eb2ff;
            --point: #d9f1ff;
            --panel: rgba(3, 16, 33, 0.7);
            --line: rgba(141, 194, 243, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            background:
                radial-gradient(1200px 700px at 15% 10%, #1f4e79 0%, rgba(31, 78, 121, 0.0) 60%),
                radial-gradient(1000px 600px at 85% 85%, #104667 0%, rgba(16, 70, 103, 0.0) 65%),
                linear-gradient(160deg, var(--bg0), var(--bg1));
            overflow: hidden;
        }

        .hud {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 10;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            backdrop-filter: blur(6px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
            max-width: min(92vw, 420px);
        }

        .title {
            margin: 0 0 6px;
            font-size: clamp(1.0rem, 2.4vw, 1.2rem);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #d7ecff;
        }

        .sub {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .metrics {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 4px;
            font-size: 0.95rem;
        }

        .metrics strong {
            color: #ffffff;
            font-weight: 600;
        }

        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>

<body>
    <section class="hud">
        <h1 class="title">Astrea Helios Propagation View</h1>
        <p class="sub">Earth sphere + one rendered point per propagated object.</p>
        <ul class="metrics" id="metrics"></ul>
    </section>
    <canvas id="scene"></canvas>

    <script>
        const stats = __STATS__;
        const numeric = __NUMERIC__;
        const frames = __FRAMES__;

        const metrics = document.getElementById("metrics");
        metrics.innerHTML = [
            `<li><strong>${stats.objects.toLocaleString()}</strong> propagated objects</li>`,
            `<li><strong>${stats.propMinutes.toFixed(1)} min</strong> propagation &nbsp;·&nbsp; <strong>${stats.stepMinutes.toFixed(1)} min</strong> steps &nbsp;·&nbsp; <strong>${stats.numFrames}</strong> frames</li>`,
            `<li><strong>${stats.elapsedMs.toFixed(1)} ms</strong> backend propagation time</li>`,
            `<li><strong>${stats.throughput.toLocaleString(undefined, { maximumFractionDigits: 0 })}</strong> objects/sec</li>`,
            `<li id="simtime"><strong>T+0.0 min</strong></li>`
        ].join("");

        const canvas = document.getElementById("scene");
        const ctx = canvas.getContext("2d");

        const state = {
            t: 0,
            simProgress: 0,
            // Camera: az = azimuth (spin around Z), el = elevation (tilt up/down)
            az: 0,
            el: 0,
            zoom: 1.0,
            // Drag
            dragging: false,
            lastX: 0,
            lastY: 0,
            pointColor: "#d9f1ff",
            earthColor: "#2e78d8",
            earthGlow: "#5eb2ff",
            earthRadiusKm: numeric.earthRadiusKm,
            maxRadiusKm: numeric.maxRadiusKm
        };

        // --- Interaction ---
        canvas.addEventListener("mousedown", (e) => {
            state.dragging = true;
            state.lastX = e.clientX;
            state.lastY = e.clientY;
            canvas.style.cursor = "grabbing";
        });
        canvas.addEventListener("mousemove", (e) => {
            if (!state.dragging) return;
            const dx = e.clientX - state.lastX;
            const dy = e.clientY - state.lastY;
            state.az += dx * 0.005;
            state.el = Math.max(-1.4, Math.min(1.4, state.el - dy * 0.005));
            state.lastX = e.clientX;
            state.lastY = e.clientY;
        });
        canvas.addEventListener("mouseup", () => { state.dragging = false; canvas.style.cursor = "grab"; });
        canvas.addEventListener("mouseleave", () => { state.dragging = false; canvas.style.cursor = "grab"; });
        canvas.style.cursor = "grab";

        canvas.addEventListener("wheel", (e) => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.1 : 0.91;
            state.zoom = Math.max(0.15, Math.min(20.0, state.zoom * factor));
        }, { passive: false });

        // Touch support
        let lastTouchDist = null;
        canvas.addEventListener("touchstart", (e) => {
            if (e.touches.length === 1) {
                state.dragging = true;
                state.lastX = e.touches[0].clientX; state.lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        }, { passive: true });
        canvas.addEventListener("touchmove", (e) => {
            if (e.touches.length === 1 && state.dragging) {
                const dx = e.touches[0].clientX - state.lastX;
                const dy = e.touches[0].clientY - state.lastY;
                state.az += dx * 0.005;
                state.el = Math.max(-1.4, Math.min(1.4, state.el - dy * 0.005));
                state.lastX = e.touches[0].clientX; state.lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2 && lastTouchDist !== null) {
                const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                state.zoom = Math.max(0.15, Math.min(20.0, state.zoom * (d / lastTouchDist)));
                lastTouchDist = d;
            }
        }, { passive: true });
        canvas.addEventListener("touchend", () => { state.dragging = false; lastTouchDist = null; }, { passive: true });

        function resize() {
            const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
            canvas.width = Math.floor(window.innerWidth * dpr);
            canvas.height = Math.floor(window.innerHeight * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function draw() {
            if (frames.length > 1) {
                state.simProgress = (state.simProgress + 1 / 90) % frames.length;
            }
            const f0 = Math.floor(state.simProgress) % frames.length;
            const f1 = (f0 + 1) % frames.length;
            const blend = state.simProgress - Math.floor(state.simProgress);
            const el = document.getElementById("simtime");
            if (el) el.innerHTML = `<strong>T+${(f0 * stats.stepMinutes).toFixed(1)} min</strong>`;

            const w = window.innerWidth;
            const h = window.innerHeight;
            const cx = w * 0.5;
            const cy = h * 0.54;

            ctx.clearRect(0, 0, w, h);

            const span = Math.max(state.maxRadiusKm, state.earthRadiusKm * 1.6);
            const scale = Math.min(w, h) * 0.43 / span * state.zoom;

            // Coordinate convention: X out of screen (depth), Y right, Z up.
            // Azimuth (az): spin around Z axis. Elevation (el): tilt above equatorial plane.
            // Drag right → az increases (scene spins counter-clockwise from above).
            // Drag up   → el increases (camera tilts to look more from above).
            const cosA = Math.cos(state.az), sinA = Math.sin(state.az);
            const cosE = Math.cos(state.el), sinE = Math.sin(state.el);

            const project = (p) => {
                // Step 1: rotate around Z by azimuth
                const rx = p[0] * cosA + p[1] * sinA;
                const ry = -p[0] * sinA + p[1] * cosA;
                const rz = p[2];
                // Step 2: rotate around rotated-Y by elevation
                // (tilts the camera up/down; positive el = looking from above)
                const fx = rx * cosE + rz * sinE;
                const fy = ry;
                const fz = -rx * sinE + rz * cosE;
                // Camera looks along -X, screen-right = Y, screen-up = Z.
                const depth = 1.0 / (1.0 + fx / (span * 2.8));
                return {
                    x: cx + fy * scale * depth,
                    y: cy - fz * scale * depth,
                    z: fx,
                    d: depth
                };
            };

            const earthCenter = project([0, 0, 0]);
            const earthEdge = project([0, state.earthRadiusKm, 0]);
            const earthRadiusPx = Math.max(2, Math.abs(earthEdge.x - earthCenter.x));

            const glow = ctx.createRadialGradient(
                earthCenter.x, earthCenter.y, earthRadiusPx * 0.4,
                earthCenter.x, earthCenter.y, earthRadiusPx * 2.5
            );
            glow.addColorStop(0, "rgba(94, 178, 255, 0.30)");
            glow.addColorStop(1, "rgba(94, 178, 255, 0.0)");
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(earthCenter.x, earthCenter.y, earthRadiusPx * 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = state.earthColor;
            ctx.beginPath();
            ctx.arc(earthCenter.x, earthCenter.y, earthRadiusPx, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "rgba(208, 235, 255, 0.24)";
            ctx.lineWidth = 1;
            for (let i = -2; i <= 2; i++) {
                const y = earthCenter.y + i * earthRadiusPx * 0.32;
                const rx = earthRadiusPx * Math.sqrt(Math.max(0, 1 - Math.pow((y - earthCenter.y) / earthRadiusPx, 2)));
                ctx.beginPath();
                ctx.ellipse(earthCenter.x, y, rx, rx * 0.22, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            const frame0 = frames[f0];
            const frame1 = frames[f1];
            for (let i = 0; i < frame0.length; i++) {
                const a = frame0[i], b = frame1[i];
                const lx = a[0] + blend * (b[0] - a[0]);
                const ly = a[1] + blend * (b[1] - a[1]);
                const lz = a[2] + blend * (b[2] - a[2]);
                const p = project([lx, ly, lz]);
                if (p.z > span * 0.9) continue;
                const alpha = Math.max(0.12, Math.min(1, 0.18 + 0.85 * p.d));
                const r = Math.max(0.7, Math.min(2.3, 1.1 * p.d));
                ctx.fillStyle = `rgba(217, 241, 255, ${alpha.toFixed(3)})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener("resize", resize);
        resize();
        draw();

        // HUD hint
        const hint = document.createElement("p");
        hint.style.cssText = "margin:8px 0 0;font-size:0.78rem;color:#6a9fc0;";
        hint.textContent = "drag to rotate · scroll to zoom";
        document.querySelector(".hud").appendChild(hint);
    </script>
</body>

</html>
