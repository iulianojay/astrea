name: Deploy Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
    tags:
      - v*
    paths:
      - "docs/**"
      - ".github/workflows/documentation.yml"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "mkdocs.yml"
      - "astrea/astro/pyastro/6dof_report/nasa_6dof_report.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Configure git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Install Doxygen and UV
        run: |
          sudo apt update
          sudo apt install -y doxygen gnuplot
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$USER_HOME/.local/bin:$PATH"

      - name: Mark repository as safe
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Fetch Tags
        run: git fetch --prune --unshallow --tags

      - name: Setup Python environment
        run: |
          make python_env

      # These just take too long right now. TODO: Figure out how to do this.
      # - name: Build and install checkcases
      #   run: |
      #     . .venv/bin/activate && make all install

      # - name: Run checkcases and build report
      #   run: |
      #     . .venv/bin/activate && make build_report 

      # - name: Run benchmarks and build report
      #   run: |
      #     . .venv/bin/activate && ./scripts/run_benchmarks.sh

      - name: Make and deploy docs
        run: uv run mkdocs gh-deploy --force
