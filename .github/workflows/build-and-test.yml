name: C/C++ CI

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'astrea/**'
      - 'cmake/**'
      - 'docker/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/**'
      - '.github/workflows/build-and-test.yml'
      - '.github/workflows/docker-publish-devcontainer.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'astrea/**'
      - 'cmake/**'
      - 'docker/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/**'
      - '.github/workflows/build-and-test.yml'
      - '.github/workflows/docker-publish-devcontainer.yml'

jobs:
  check-docker-changes:
    runs-on: ubuntu-latest
    outputs:
      docker-changed: ${{ steps.changes.outputs.docker }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: changes
      with:
        filters: |
          docker:
          - 'docker/Dockerfile.dev'
          - '.github/workflows/docker-publish-devcontainer.yml'

  wait-for-docker:
    runs-on: ubuntu-latest
    needs: check-docker-changes
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
      ||
      (
        github.event_name == 'pull_request' &&
        needs.check-docker-changes.outputs.docker-changed == 'true'
      )
    steps:
    - name: Wait for Docker workflow
      uses: fountainhead/action-wait-for-check@v1.2.0
      id: wait-for-docker
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        checkName: build-and-publish
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        intervalSeconds: 30
        timeoutSeconds: 1800

  build-and-test-linux:
    runs-on: ubuntu-latest
    needs: [check-docker-changes, wait-for-docker]
    if: >
      always() && (
        github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        ||
        needs.wait-for-docker.result == 'success'
        ||
        needs.check-docker-changes.outputs.docker-changed == 'false'
        ||
        github.event_name != 'pull_request'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: gcc-16
          cc: gcc-16
          cxx: g++-16
        - name: clang
          cc: clang
          cxx: clang++
    container:
      image: ${{ format('ghcr.io/{0}:{1}', github.repository, (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.check-docker-changes.outputs.docker-changed == 'true' && needs.wait-for-docker.result == 'success' && format('pr-{0}', github.event.pull_request.number) || 'main')) }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    name: Linux • ${{ matrix.name }}

    steps:
    - name: https://github.com/actions/checkout/issues/1720
      run: |
        chmod -R u+rwX .

    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }} # https://github.com/actions/checkout/discussions/1637

    - name: Mark repository as safe
      run: git config --global --add safe.directory $GITHUB_WORKSPACE

    - name: Fetch tags
      run: git fetch --prune --unshallow --tags

    - name: Setup uv
      uses: astral-sh/setup-uv@v6

    - name: Setup
      run: |
        bash ./scripts/ci_bootstrap.sh

    - name: Detect Conan Profile For Selected Compiler
      run: |
        . .venv/bin/activate
        CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} conan profile detect --force

    - name: Build and Install Release
      run: |
        . .venv/bin/activate && make cc=${{ matrix.cc }} cxx=${{ matrix.cxx }} release all install

    - name: Run Tests
      run: |
        . .venv/bin/activate && make cc=${{ matrix.cc }} cxx=${{ matrix.cxx }} run_tests

    - name: Run Examples
      run: |
        . .venv/bin/activate && make cc=${{ matrix.cc }} cxx=${{ matrix.cxx }} run_examples

