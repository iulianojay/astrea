  coverage:
    runs-on: ubuntu-latest
    needs: [check-docker-changes, wait-for-docker]
    if: >
      always() && (
        github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        ||
        needs.wait-for-docker.result == 'success'
        ||
        needs.check-docker-changes.outputs.docker-changed == 'false'
        ||
        github.event_name != 'pull_request'
      )
    container:
      image: ${{ format('ghcr.io/{0}:{1}', github.repository, (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.check-docker-changes.outputs.docker-changed == 'true' && needs.wait-for-docker.result == 'success' && format('pr-{0}', github.event.pull_request.number) || 'main')) }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

    steps:
    - name: https://github.com/actions/checkout/issues/1720
      run: |
        chmod -R u+rwX .

    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }} # https://github.com/actions/checkout/discussions/1637

    - name: Mark repository as safe
      run: git config --global --add safe.directory $GITHUB_WORKSPACE

    - name: Fetch tags
      run: git fetch --prune --unshallow --tags

    - name: Setup uv
      uses: astral-sh/setup-uv@v6

    - name: Setup
      run: |
        export CI_INSTALL_GCOVR=1
        bash ./scripts/ci_bootstrap.sh

    - name: Build and Install Debug
      run: |
        . .venv/bin/activate && make cc=gcc-16 cxx=g++-16 debug all install

    - name: Run Coverage
      run: |
        mkdir .gcovr
        touch .gcovr/coverage.xml
        . .venv/bin/activate && make cc=gcc-16 cxx=g++-16 coverage

    - name: Extract Coverage Percentage
      run: |
        touch coverage.txt
        bash ./scripts/extract_coverage_pct.sh
        echo "COVERAGE_PCT=$(cat coverage.txt)" >> "$GITHUB_ENV"

    - name: Create Coverage Badge
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 238a4a61ca19471caa1e39376158d625
        filename: coverage.json
        label: Coverage
        message: ${{ env.COVERAGE_PCT }}%
        valColorRange: ${{ env.COVERAGE_PCT }}
        maxColorRange: 100
        minColorRange: 60