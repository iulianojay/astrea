name: C/C++ CI

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-docker-changes:
    runs-on: ubuntu-latest
    outputs:
      docker-changed: ${{ steps.changes.outputs.docker }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: changes
      with:
        filters: |
          docker:
          - 'docker/devcontainer/Dockerfile'
          - '.github/workflows/docker-publish-devcontainer.yml'

  wait-for-docker:
    runs-on: ubuntu-latest
    needs: check-docker-changes
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
      ||
      (
        github.event_name == 'pull_request' &&
        needs.check-docker-changes.outputs.docker-changed == 'true'
      )
    steps:
    - name: Wait for Docker workflow
      uses: fountainhead/action-wait-for-check@v1.2.0
      id: wait-for-docker
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        checkName: build-and-publish
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        intervalSeconds: 30
        timeoutSeconds: 1800

  build-and-test:
    runs-on: ubuntu-latest
    needs: [check-docker-changes, wait-for-docker]
    if: >
      always() && (
        github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        ||
        needs.wait-for-docker.result == 'success'
        ||
        needs.check-docker-changes.outputs.docker-changed == 'false'
        ||
        github.event_name != 'pull_request'
      )
    container:
      image: ghcr.io/iulianojay/astrea:dev
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

    steps:
    - name: https://github.com/actions/checkout/issues/1720
      run: |
        chmod -R u+rwX .

    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }} # https://github.com/actions/checkout/discussions/1637

    - name: Mark repository as safe
      run: git config --global --add safe.directory $GITHUB_WORKSPACE

    - name: Fetch tags
      run: git fetch --prune --unshallow --tags

    - name: Setup
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        make python_env

    - name: Build and Install Release
      run: |
        . .venv/bin/activate && make release all install

    - name: Run Tests
      run: |
        . .venv/bin/activate && make run_tests

    - name: Run Examples
      run: |
        . .venv/bin/activate && make run_examples

  coverage:
    runs-on: ubuntu-latest
    needs: [check-docker-changes, wait-for-docker]
    if: >
      always() && (
        github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        ||
        needs.wait-for-docker.result == 'success'
        ||
        needs.check-docker-changes.outputs.docker-changed == 'false'
        ||
        github.event_name != 'pull_request'
      )
    container:
      image: ghcr.io/iulianojay/astrea:dev
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

    steps:
    - name: https://github.com/actions/checkout/issues/1720
      run: |
        chmod -R u+rwX .

    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }} # https://github.com/actions/checkout/discussions/1637

    - name: Mark repository as safe
      run: git config --global --add safe.directory $GITHUB_WORKSPACE

    - name: Fetch tags
      run: git fetch --prune --unshallow --tags

    - name: Setup
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        make python_env

    - name: Build and Install Debug
      run: |
        . .venv/bin/activate && make debug all install

    - name: Run Coverage
      run: |
        mkdir .gcovr
        touch .gcovr/coverage.xml
        . .venv/bin/activate && make coverage

    - name: Extract Coverage Percentage
      run: |
        touch coverage.txt
        bash ./scripts/extract_coverage_pct.sh
        echo "COVERAGE_PCT=$(cat coverage.txt)" >> "$GITHUB_ENV"

    - name: Create Coverage Badge
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 238a4a61ca19471caa1e39376158d625
        filename: coverage.json
        label: Coverage
        message: ${{ env.COVERAGE_PCT }}%
        valColorRange: ${{ env.COVERAGE_PCT }}
        maxColorRange: 100
        minColorRange: 60