version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Europe/Helsinki"
    target-branch: "main"
    commit-message:
      prefix: "[dependabot]"
      prefix-development: "[dependabot]"
    groups:
      all-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Europe/Helsinki"
    target-branch: "main"
    commit-message:
      prefix: "[dependabot]"
      prefix-development: "[dependabot]"
    groups:
      all-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Europe/Helsinki"
    target-branch: "main"
    commit-message:
      prefix: "[dependabot]"
      prefix-development: "[dependabot]"
    groups:
      all-deps:
        patterns:
          - "*"
